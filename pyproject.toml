[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pocket-spectrum"
version = "0.3.4"
description = "PocketTerm RTL-SDR spectrum scanner"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.50",
    "rich>=13.0",
]

[project.scripts]
pocket-spectrum = "pocket_spectrum.app:main"

[tool.setuptools.packages.find]
where = ["src"]
